name: Bug report
description: Something in the app doesn't work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please don't include real IPs,
        hostnames, passwords, API tokens or `viewer.jnlp` files — use placeholders.
  - type: input
    id: app-version
    attributes:
      label: App version
      description: From the APK file name or the Releases page (e.g. v1.0.0).
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: iDRAC / Proxmox VE version
      description: Which firmware / version were you managing? (e.g. iDRAC6 2.92, Proxmox VE 8.2)
      placeholder: iDRAC6 2.92 / Proxmox VE 8.2.4
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, in order?
      placeholder: |
        1. Open the Proxmox server
        2. Tap a container
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error text
      description: The exact error message or task log, if any. This is automatically formatted as code.
      render: text
    validations:
      required: false
